<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CivFlow — Offline</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      @media (prefers-color-scheme: dark) {
        html, body { background: #0a0f1c; color: #f1f5f9; }
        .card { background: #0f172a !important; border-color: #334155 !important; }
        .muted { color: #94a3b8 !important; }
      }
      .wrap { display: flex; min-height: 100%; align-items: center; justify-content: center; padding: 24px; }
      .card {
        max-width: 360px;
        text-align: center;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 32px 28px;
        box-shadow: 0 12px 32px -8px rgba(15, 23, 42, 0.14);
      }
      .mark {
        width: 44px; height: 44px; border-radius: 10px; background: #0f172a;
        display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;
      }
      h1 { font-size: 18px; margin: 0 0 8px; }
      p.muted { color: #64748b; font-size: 14px; line-height: 1.5; margin: 0 0 20px; }
      button {
        border: none; border-radius: 10px; background: #0f172a; color: #fff;
        font-size: 14px; font-weight: 500; padding: 10px 18px; cursor: pointer;
      }
      button:hover { background: #1e293b; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <div class="mark">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
            <path d="M1 9a16 16 0 0 1 22 0M5 13a10 10 0 0 1 14 0M8.5 17a5 5 0 0 1 7 0M12 21h.01" stroke-opacity="0.4" />
            <path d="M2 2l20 20" />
          </svg>
        </div>
        <h1>You&#8217;re offline</h1>
        <p class="muted">
          This page hasn&#8217;t been loaded before, so CivFlow can&#8217;t show it without a connection.
          Anything you&#8217;ve already opened today should still work.
        </p>
        <button onclick="location.reload()">Try again</button>
      </div>
    </div>
  </body>
</html>
